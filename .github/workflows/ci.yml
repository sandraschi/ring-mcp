name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=ring_mcp --cov-report=xml --cov-report=term-missing --asyncio-mode=auto

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ubuntu-pip-lint-${{ hashFiles('**/requirements-dev.txt') }}
        restore-keys: |
          ubuntu-pip-lint-

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort mypy flake8

    - name: Check formatting with Black
      run: black --check --diff ring_mcp tests scripts

    - name: Check import sorting with isort
      run: isort --check-only --diff ring_mcp tests scripts

    - name: Type check with MyPy
      run: mypy ring_mcp --ignore-missing-imports

    - name: Lint with flake8
      run: flake8 ring_mcp tests scripts --max-line-length=100 --extend-ignore=E203,W503

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security scan
      run: bandit -r ring_mcp -f json -o bandit-report.json || true

    - name: Run Safety vulnerability check
      run: safety check --output json || true

    - name: Upload security scan results
      uses: actions/upload-artifact@v3
      with:
        name: security-scan-results
        path: |
          bandit-report.json

  package:
    name: Build MCPB Package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install MCPB CLI
      run: |
        python -m pip install --upgrade pip
        pip install mcpb

    - name: Validate MCPB configuration
      run: |
        mcpb validate mcpb/manifest.json
        mcpb validate mcpb/mcpb.json

    - name: Build MCPB package
      run: |
        mcpb pack . dist/ring-mcp.mcpb --no-sign

    - name: Upload MCPB package
      uses: actions/upload-artifact@v3
      with:
        name: ring-mcp-mcpb
        path: dist/ring-mcp.mcpb

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Check documentation files
      run: |
        # Check for required documentation files
        required_files=("README.md" "CHANGELOG.md" "CONTRIBUTING.md" "SECURITY.md" "LICENSE")
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "Missing required documentation file: $file"
            exit 1
          fi
        done

        # Check README structure
        if ! grep -q "## Installation" README.md; then
          echo "README.md missing Installation section"
          exit 1
        fi

        if ! grep -q "## Usage" README.md; then
          echo "README.md missing Usage section"
          exit 1
        fi

        echo "Documentation check passed"

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, lint, security, package, docs]

    steps:
    - uses: actions/checkout@v4

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v1.0.1
        release_name: Ring MCP v1.0.1
        body: |
          ## What's New in v1.0.1

          ### ✨ Features
          - MCPB packaging migration for improved distribution
          - FastMCP 2.12.0 compatibility with enhanced tool registration
          - Lazy authentication for improved startup reliability
          - Comprehensive AI prompt templates (6 templates)
          - Enhanced error handling and structured logging

          ### 🔧 Technical Improvements
          - Gold Status quality standards implementation
          - Comprehensive CI/CD pipeline with multi-platform testing
          - Advanced security scanning and vulnerability checks
          - Complete documentation suite (README, API docs, contributing guide)
          - Type checking, linting, and code formatting enforcement

          ### 📦 Distribution
          - Official MCPB package available for Claude Desktop
          - Cross-platform compatibility (Windows, macOS, Linux)
          - Automated package building and validation

          ### 🛡️ Security & Quality
          - Security vulnerability scanning
          - Comprehensive test coverage (>80%)
          - Input validation and secure credential handling
          - Production-ready error handling

          ### 📚 Documentation
          - Complete API reference documentation
          - Installation and configuration guides
          - Troubleshooting and debugging guides
          - Security policy and contribution guidelines

          For full changelog, see [CHANGELOG.md](https://github.com/ring-mcp/ring-mcp/blob/main/CHANGELOG.md)
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: dist/ring-mcp.mcpb
        asset_name: ring-mcp-v1.0.1.mcpb
        asset_content_type: application/octet-stream
