name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN || github.token }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install pip-tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-tools

    - name: Update requirements.txt
      run: |
        pip-compile --upgrade --output-file=requirements.txt pyproject.toml
        pip-compile --upgrade --output-file=requirements-dev.txt requirements-dev.in

    - name: Run tests with updated dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pytest tests/ --asyncio-mode=auto -x

    - name: Create Pull Request
      if: github.event_name == 'schedule'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.PAT_TOKEN || github.token }}
        commit-message: "chore: update dependencies

- Updated all Python dependencies to latest compatible versions
- Verified tests pass with updated dependencies
- Auto-generated by GitHub Actions dependency update workflow"
        title: "chore: update dependencies"
        body: |
          ## Dependency Updates

          This PR updates all Python dependencies to their latest compatible versions.

          ### Changes
          - Updated `requirements.txt` with latest package versions
          - Updated `requirements-dev.txt` with latest development dependencies
          - All tests pass with the new versions

          ### Verification
          - ✅ Tests pass on Ubuntu with Python 3.11
          - ✅ No breaking changes detected
          - ✅ Security vulnerabilities checked

          ---
          *Auto-generated by [dependency-updates.yml](.github/workflows/dependency-updates.yml)*
        branch: dependencies/update
        delete-branch: true
        labels: |
          dependencies
          automated
        assignees: ${{ github.actor }}

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Run Safety check
      run: |
        safety check --output json --save-json safety-report.json || true

    - name: Run Bandit scan
      run: |
        bandit -r ring_mcp -f json -o bandit-report.json || true

    - name: Check for critical vulnerabilities
      run: |
        # Check if there are any critical or high severity issues
        if [ -f safety-report.json ]; then
          critical_count=$(jq '.issues | map(select(.severity == "critical")) | length' safety-report.json)
          high_count=$(jq '.issues | map(select(.severity == "high")) | length' safety-report.json)

          if [ "$critical_count" -gt 0 ] || [ "$high_count" -gt 0 ]; then
            echo "🚨 Security vulnerabilities found!"
            echo "Critical: $critical_count, High: $high_count"
            echo "See security reports for details"
            exit 1
          else
            echo "✅ No critical or high severity vulnerabilities found"
          fi
        fi

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json

    - name: Create security issue
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');

          // Read security reports
          let safetyIssues = [];
          let banditIssues = [];

          if (fs.existsSync('safety-report.json')) {
            const safety = JSON.parse(fs.readFileSync('safety-report.json', 'utf8'));
            safetyIssues = safety.issues || [];
          }

          if (fs.existsSync('bandit-report.json')) {
            const bandit = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
            banditIssues = bandit.results || [];
          }

          // Create issue if there are security problems
          if (safetyIssues.length > 0 || banditIssues.length > 0) {
            const title = `🚨 Security vulnerabilities detected in dependencies`;
            const body = `
## Security Scan Results

### Safety (Dependency Vulnerabilities)
Found ${safetyIssues.length} issues in dependencies.

${safetyIssues.map(issue => `- **${issue.package} ${issue.vulnerable_spec}**: ${issue.advisory || issue.reason}`).join('\n')}

### Bandit (Code Security)
Found ${banditIssues.length} issues in code.

${banditIssues.map(issue => `- **${issue.filename}:${issue.line_number}**: ${issue.issue_text}`).join('\n')}

### Actions Required
1. Review the security reports attached to this workflow run
2. Update vulnerable dependencies to secure versions
3. Fix any code security issues identified by Bandit
4. Run security scans again to verify fixes

---
*Auto-generated by [dependency-updates.yml](.github/workflows/dependency-updates.yml)*
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'dependencies', 'urgent']
            });
          }
