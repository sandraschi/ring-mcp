name: Build MCPB Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (optional, defaults to tag or run number)'
        required: false
        type: string

jobs:
  build-mcpb:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install MCPB CLI
      run: npm install -g @anthropic-ai/mcpb

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate manifest
      run: mcpb validate mcpb/manifest.json

    - name: Build MCPB package
      run: mcpb pack --output dist/ring-mcp.mcpb --no-sign

    - name: Verify package
      run: |
        if (!(Test-Path "dist/ring-mcp.mcpb")) {
          Write-Error "Package file not found"
          exit 1
        }
        $size = (Get-Item "dist/ring-mcp.mcpb").Length / 1MB
        Write-Host "Package size: $([math]::Round($size, 2)) MB"
        if ($size -lt 0.1 -or $size -gt 10) {
          Write-Warning "Package size seems unusual: $size MB"
        }

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: ring-mcp-mcpb
        path: dist/ring-mcp.mcpb
        retention-days: 90

    - name: Create GitHub release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/ring-mcp.mcpb
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Python distribution
      run: |
        pip install build
        python -m build

    - name: Publish to PyPI (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}

    - name: Create summary
      run: |
        Write-Host "## 📦 Build Summary" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "### Package Details" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- **Name**: ring-mcp.mcpb" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- **Version**: ${{ github.ref_name || 'manual' }}" >> $env:GITHUB_STEP_SUMMARY
        $size = (Get-Item "dist/ring-mcp.mcpb").Length / 1MB
        Write-Host "- **Size**: $([math]::Round($size, 2)) MB" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- **Platform**: Windows" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "### Files Generated" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- ✅ MCPB Package: dist/ring-mcp.mcpb" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- ✅ Python Wheel: dist/*.whl" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "- ✅ Source Distribution: dist/*.tar.gz" >> $env:GITHUB_STEP_SUMMARY
        Write-Host "" >> $env:GITHUB_STEP_SUMMARY
        if (startsWith(github.ref, 'refs/tags/v')) {
          Write-Host "### Release Created" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- ✅ GitHub Release: ${{ github.ref_name }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- ✅ PyPI Publication" >> $env:GITHUB_STEP_SUMMARY
        } else {
          Write-Host "### Next Steps" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- Tag version: \`git tag v1.0.1\`" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- Push tag: \`git push origin v1.0.1\`" >> $env:GITHUB_STEP_SUMMARY
        }
