[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ring-mcp"
version = "1.0.3"
description = "Ring Security Ecosystem MCP - Universal control for Ring doorbell, burglar alarm, fire alarm, and cameras"
authors = [
    {name = "Sandra", email = "sandra@example.com"}
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Typing :: Typed"
]
keywords = [
    "ring", "security", "cameras", "doorbells", "alarm", "mcp", "fastmcp",
    "monitoring", "automation", "home-security", "iot", "smart-home", "surveillance"
]
dependencies = [
    "fastmcp>=3.2.0", # Fleet: FastMCP 3.2+ (MCP 3.2 ecosystem)
    "fastapi>=0.115.0", # HTTP server + composition (not bundled by fastmcp 3.2)
    "ring-doorbell>=0.8.0", # Real Ring integration
    "requests>=2.31.0", # HTTP client (ring_client)
    "httpx>=0.25.0", # Modern HTTP client
    "pydantic>=2.0.0", # Data validation
    "python-dotenv>=1.0.0", # Environment management
    "asyncio-throttle>=1.0.0", # Rate limiting
    "python-jose[cryptography]>=3.3.0", # JWT handling
    "aiocache>=0.12.0", # Async caching
    "tenacity>=8.2.0", # Retry logic
    "prometheus-client>=0.20.0", # Prometheus metrics
    "structlog>=23.1.0", # Structured logging
    "websockets>=11.0.0,<16.0.0", # WebSocket support
    "paho-mqtt>=2.1.0", # Optional ring-mqtt (Ring Alarm) MQTT bridge
    "python-dateutil>=2.8.2", # Date utilities
    "anyio>=4.5.0", # Async utilities
    "tomli>=0.10.2; python_version < \"3.11\"", # TOML support for older Python
    "uvicorn>=0.23.0",
    "python-json-logger>=2.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "respx>=0.20.0",
    "types-requests>=2.31.0",
    "types-python-dateutil>=2.8.0",
    "ruff>=0.15.2",
    "prefab-ui>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",             # Modern Python linter
    "respx>=0.20.0",           # HTTP mocking for tests
    "types-requests>=2.31.0",  # Type stubs for requests
    "types-python-dateutil>=2.8.0"  # Type stubs for dateutil
]

[project.scripts]
ring-mcp = "ring_mcp:main"
ring-mcp-http = "ring_mcp.http_server:main"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
