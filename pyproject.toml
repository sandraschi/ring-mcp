[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ring-mcp"
version = "1.0.1"
description = "Ring Security Ecosystem MCP - Universal control for Ring doorbell, burglar alarm, fire alarm, and cameras"
authors = [
    {name = "Sandra", email = "sandra@example.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Typing :: Typed"
]
keywords = [
    "ring", "security", "cameras", "doorbells", "alarm", "mcp", "fastmcp",
    "monitoring", "automation", "home-security", "iot", "smart-home", "surveillance"
]
dependencies = [
    "fastmcp>=2.13.0,<3.0.0",       # Latest MCP specification
    "python-ring-doorbell>=0.8.0",  # Real Ring integration
    "httpx>=0.27.0,<1.0.0",         # Modern HTTP client
    "pydantic>=2.0.0,<3.0.0",       # Data validation
    "python-dotenv>=1.0.0",         # Environment management
    "asyncio-throttle>=1.0.0",      # Rate limiting
    "python-jose[cryptography]>=3.3.0",  # JWT handling
    "aiocache>=0.12.0",             # Async caching
    "tenacity>=8.2.0",              # Retry logic
    "prometheus-client>=0.20.0",    # Prometheus metrics
    "structlog>=23.1.0",            # Structured logging
    "websockets>=11.0.0,<12.0.0",   # WebSocket support
    "python-dateutil>=2.8.2",       # Date utilities
    "anyio>=4.5.0",                 # Async utilities
    "tomli>=0.10.2; python_version < \"3.11\"",  # TOML support for older Python
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",             # Modern Python linter
    "respx>=0.20.0",           # HTTP mocking for tests
    "fastmcp[test]>=2.13.0",   # FastMCP testing tools
    "types-requests>=2.31.0",  # Type stubs for requests
    "types-python-dateutil>=2.8.0"  # Type stubs for dateutil
]

[project.scripts]
ring-mcp = "ring_mcp:main"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "EXE", "FA", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]
ignore = ["E501", "E722", "S101", "S104"]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
